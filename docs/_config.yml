title: Rakka
description: Ruby 4.0 の Ractor で動く、アクター型のイベントソーシングライブラリ
lang: ja

# GitHub Pages でビルドする（Settings → Pages → Deploy from a branch → main /docs）
remote_theme: just-the-docs/just-the-docs@v0.12.0
plugins:
  - jekyll-remote-theme
  # テーマが使うプラグイン。gemのテーマなら自動で読まれるが、remote_themeでは明示が要る
  - jekyll-include-cache
  - jekyll-seo-tag

color_scheme: rakka

# 注記。色は _sass/color_schemes/rakka.scss の $shu / $sumi / $kitsune
callouts:
  note:
    title: '\30E1\30E2' # メモ（CSS のエスケープ。SCSS は ASCII のみにする）
    color: sumi
  important:
    title: '\5927\4E8B\306A\3053\3068' # 大事なこと（CSS のエスケープ。SCSS は ASCII のみにする）
    color: shu
  warning:
    title: '\6CE8\610F' # 注意（CSS のエスケープ。SCSS は ASCII のみにする）
    color: kitsune

search_enabled: true
search:
  heading_level: 3
  previews: 2
  # 日本語は単語に区切られないので、記号でも区切って部分一致を拾いやすくする
  tokenizer_separator: /[\s\-/、。（）「」・]+/

aux_links:
  GitHub: https://github.com/Ya-Suzuki/rakka
aux_links_new_tab: true

gh_edit_link: true
gh_edit_link_text: このページを編集
gh_edit_repository: https://github.com/Ya-Suzuki/rakka
gh_edit_branch: main
gh_edit_source: docs
gh_edit_view_mode: edit

back_to_top: true
back_to_top_text: ページの先頭へ

exclude:
  - README.md
