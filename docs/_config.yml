title: Rakka
description: Ruby 4.0 の Ractor で動く、アクター型のイベントソーシングライブラリ
lang: ja

# GitHub Pages でビルドする（Settings → Pages → Deploy from a branch → main /docs）
remote_theme: just-the-docs/just-the-docs@v0.12.0
plugins:
  - jekyll-remote-theme
  # テーマが使うプラグイン。gemのテーマなら自動で読まれるが、remote_themeでは明示が要る
  - jekyll-include-cache
  - jekyll-seo-tag

search_enabled: true
search:
  heading_level: 3
  previews: 2
  # 日本語は単語に区切られないので、記号でも区切って部分一致を拾いやすくする
  tokenizer_separator: /[\s\-/、。（）「」・]+/

aux_links:
  GitHub: https://github.com/Ya-Suzuki/rakka
aux_links_new_tab: true

gh_edit_link: true
gh_edit_link_text: このページを編集
gh_edit_repository: https://github.com/Ya-Suzuki/rakka
gh_edit_branch: main
gh_edit_source: docs
gh_edit_view_mode: edit

back_to_top: true
back_to_top_text: ページの先頭へ

exclude:
  - README.md
