# リポジトリ直下の compose.yaml の PostgreSQL（rakka / rakka）に合わせてある
default: &default
  adapter: postgresql
  encoding: unicode
  host: <%= ENV.fetch("DATABASE_HOST", "localhost") %>
  port: <%= ENV.fetch("DATABASE_PORT", 5432) %>
  username: <%= ENV.fetch("DATABASE_USER", "rakka") %>
  password: <%= ENV.fetch("DATABASE_PASSWORD", "rakka") %>
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: auction_house_development

test:
  <<: *default
  database: auction_house_test

production:
  <<: *default
  database: auction_house_production
